<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | RAW FILM Photography</title>

    <link rel="stylesheet" href="/css/details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous">
</head>

<body>
    <!-- Global Header Component (Single Line) -->
    <div id="site-header"></div>
    <script src="/header.js"></script>

    <main>
        <h1>FASHION &amp; MODEL PORTFOLIO</h1>

        <div class="photos" id="gallery"></div>
    </main>

    <!-- Global Footer Component (Single Line) -->
    <div id="site-footer"></div>
    <script src="/footer.js"></script>
    
    <script>
        const images = [
            "IMG_6117", "IMG_6118", "IMG_6119", "IMG_6120", "IMG_6121", "IMG_6122", 
            "IMG_6123", "IMG_6124", "IMG_6125", "portfolio_10", "portfolio_11", "portfolio_12"
        ];

        const gallery = document.getElementById("gallery");

        images.forEach(file => {
            const img = document.createElement("img");
            img.src = `/image/portfolio/${file}.webp`;
            img.alt = `Raw Film Model Portfolio Shoot ${file}`;
            img.loading = "lazy";
            gallery.appendChild(img);
        });
    </script>
</body>

</html>
