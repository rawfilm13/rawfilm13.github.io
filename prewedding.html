<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre Wedding Stories | RAW FILM Photography</title>
    <meta name="description" content="Explore romantic and cinematic pre-wedding shoot stories by RAW FILM across Punjab. Candid moments, timeless elegance, and authentic love captured forever.">
    <link rel="canonical" href="https://rawfilmphotography.com/prewedding.html">

    <!-- Stylesheets with Cache Buster -->
    <link rel="stylesheet" href="/css/details.css?v=3.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous">
    <!-- Swiper 11 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <style>
        /* Instant Guaranteed Dark Theme */
        body {
            background-color: #0a0a0a !important;
            color: #f0f0f0 !important;
            margin: 0;
            overflow-x: hidden;
        }
    </style>
</head>

<body class="prewedding-page gallery-page">
    <!-- Global Header Component (Single Line) -->
    <div id="site-header"></div>
    <script src="/header.js?v=2.1"></script>

    <!-- Pre-Wedding Page Header -->
    <header class="prewedding-hero">
        <span class="prewedding-badge">Cinematic Pre-Wedding Chapters</span>
        <h1>Pre Wedding Shoots</h1>
        <p>Every love story is sacred, intimate, and magical. Explore our curated pre-wedding chapters capturing genuine laughter, unspoken promises, and timeless romance across Punjab.</p>
    </header>

    <!-- Couple Sections Container -->
    <main id="couples-container"></main>

    <!-- Fullscreen Lightbox Modal -->
    <div class="rf-lightbox" id="rfLightbox" role="dialog" aria-hidden="true" onclick="closeLightbox(event)">
        <button class="rf-lightbox-close" onclick="closeLightbox(event)" aria-label="Close image">&times;</button>
        <div class="rf-lightbox-content" onclick="event.stopPropagation()">
            <img class="rf-lightbox-img" id="rfLightboxImg" src="" alt="Pre-wedding photo full view">
            <div class="rf-lightbox-caption" id="rfLightboxCaption"></div>
        </div>
    </div>

    <!-- Global Footer Component (Single Line) -->
    <div id="site-footer"></div>
    <script src="/footer.js?v=2.1"></script>

    <!-- Swiper 11 JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const couplesData = [
            {
                name: "Manpreet & Aman",
                folder: "Manpreet & Aman",
                description: "Pure elegance and heartfelt intimacy woven together in picturesque frames.",
                images: [
                    "DSC01700", "DSC01773", "DSC01870", "DSC02377", "DSC02396", "DSC02440", 
                    "DSC02536", "DSC025367", "DSC02572"
                ]
            },
            {
                name: "Love & Kiran",
                folder: "Love & Kiran",
                description: "A soulful journey of unspoken glances, golden hour warmth, and timeless romance.",
                images: [
                    "cover", "thumbnail", "1 (42)", "3 (10)", "5 (24)", "5 (51)", "5 (52)", "8 (4)", "8 (32)", "8 (45)"
                ]
            },
            {
                name: "Heera & Komal",
                folder: "Heera & Komal",
                description: "Joyous laughter, vibrant moments, and a beautiful celebration of two souls becoming one.",
                images: [
                    "DSC01266", "DSC01309", "DSC01315", "DSC01333", "DSC01341", "DSC01398", 
                    "DSC01477", "DSC01517", "DSC01556", "DSC01570", "DSC01614", "DSC01798", "DSC01914"
                ]
            },
            {
                name: "Gurtaj & Harmeen",
                folder: "Gurtaj & Harmeen",
                description: "A regal cinematic chapter filled with whispered vows, royal grace, and eternal love.",
                images: [
                    "DSC08912", "DSC08927", "DSC09002", "DSC09019", "DSC09037", "DSC09101", 
                    "DSC09211", "DSC09254", "DSC09293", "DSC09305", "DSC09323", "DSC09326", 
                    "DSC09373", "DSC09446", "DSC09455", "DSC09461", "DSC09519", "DSC09555", 
                    "DSC09575", "DSC09684", "DSC09696", "DSC09773", "DSC09858"
                ]
            },
            {
                name: "Harman & Sarbjot",
                folder: "Harman & sarbjot",
                description: "Candid smiles and electric chemistry captured against scenic, sun-drenched vistas.",
                images: [
                    "DSC07936", "DSC07942", "DSC07959", "DSC07976_2", "DSC08021", "DSC08171", 
                    "DSC08224", "DSC08271", "DSC08278", "DSC08309", "DSC08347"
                ]
            },
            {
                name: "Arshdeep & Harpreet",
                folder: "Arshdeep & Harpreet",
                description: "Embracing the serenity of nature with effortless affection and authentic romance.",
                images: [
                    "3", "DSC03128", "DSC03152", "DSC03196", "DSC03239", "DSC03248", 
                    "DSC03249", "DSC03259", "DSC03287", "DSC03320", "DSC03338", "DSC03382"
                ]
            }
        ];

        const container = document.getElementById("couples-container");

        couplesData.forEach((couple, idx) => {
            const section = document.createElement("section");
            section.className = "couple-section";
            section.id = `couple-${idx + 1}`;

            // Couple Header
            const headerDiv = document.createElement("div");
            headerDiv.className = "couple-header";
            headerDiv.innerHTML = `
                <span class="couple-tag">Chapter ${idx + 1}</span>
                <h2 class="couple-title">${couple.name}</h2>
                <p class="couple-desc">${couple.description}</p>
            `;
            section.appendChild(headerDiv);

            // Slider Wrapper
            const sliderWrapper = document.createElement("div");
            sliderWrapper.className = "couple-slider-wrapper";

            const trackDiv = document.createElement("div");
            trackDiv.className = "couple-slider-track";

            // Outside Prev Arrow
            const prevBtn = document.createElement("button");
            prevBtn.className = `slider-arrow-btn prev-btn-${idx}`;
            prevBtn.setAttribute("aria-label", `Previous photo for ${couple.name}`);
            prevBtn.innerHTML = '<i class="fa fa-angle-left"></i>';

            // Outside Next Arrow
            const nextBtn = document.createElement("button");
            nextBtn.className = `slider-arrow-btn next-btn-${idx}`;
            nextBtn.setAttribute("aria-label", `Next photo for ${couple.name}`);
            nextBtn.innerHTML = '<i class="fa fa-angle-right"></i>';

            // Swiper Container
            const swiperContainer = document.createElement("div");
            swiperContainer.className = `swiper couple-swiper swiper-${idx}`;

            const swiperWrapper = document.createElement("div");
            swiperWrapper.className = "swiper-wrapper";

            couple.images.forEach(imgName => {
                const slide = document.createElement("div");
                slide.className = "swiper-slide couple-slide";

                const encodedFolder = encodeURIComponent(couple.folder);
                const encodedFile = encodeURIComponent(imgName);
                const imgSrc = `/image/prewedding/${encodedFolder}/${encodedFile}.webp`;

                const card = document.createElement("div");
                card.className = "couple-card";
                card.onclick = () => openLightbox(imgSrc, `${couple.name} &bull; Pre-Wedding Shoot`);

                card.innerHTML = `
                    <img class="card-img" src="${imgSrc}" alt="${couple.name} Pre Wedding - RAW FILM" loading="lazy">
                    <div class="couple-card-overlay">
                        <div class="zoom-icon">
                            <i class="fa fa-search-plus"></i>
                        </div>
                    </div>
                `;

                slide.appendChild(card);
                swiperWrapper.appendChild(slide);
            });

            swiperContainer.appendChild(swiperWrapper);

            // Assemble track with outside arrows
            trackDiv.appendChild(prevBtn);
            trackDiv.appendChild(swiperContainer);
            trackDiv.appendChild(nextBtn);
            sliderWrapper.appendChild(trackDiv);

            // Pagination Dots
            const paginationDiv = document.createElement("div");
            paginationDiv.className = `swiper-pagination couple-pagination pagination-${idx}`;
            sliderWrapper.appendChild(paginationDiv);

            section.appendChild(sliderWrapper);
            container.appendChild(section);

            // Initialize Swiper for this couple
            new Swiper(swiperContainer, {
                slidesPerView: 1, // Mobile: 1 slide
                spaceBetween: 14,
                loop: true,
                speed: 600,
                grabCursor: true,
                navigation: {
                    prevEl: prevBtn,
                    nextEl: nextBtn,
                },
                pagination: {
                    el: paginationDiv,
                    clickable: true,
                },
                breakpoints: {
                    640: {
                        slidesPerView: 2,
                        spaceBetween: 18,
                    },
                    1024: {
                        slidesPerView: 4, // PC: 4 slides
                        spaceBetween: 22,
                    }
                }
            });
        });

        // Lightbox Functions
        const lightbox = document.getElementById("rfLightbox");
        const lightboxImg = document.getElementById("rfLightboxImg");
        const lightboxCaption = document.getElementById("rfLightboxCaption");

        function openLightbox(src, caption) {
            lightboxImg.src = src;
            lightboxCaption.innerHTML = `<strong>${caption}</strong>`;
            lightbox.classList.add("active");
            lightbox.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox(e) {
            if (e) e.stopPropagation();
            lightbox.classList.remove("active");
            lightbox.setAttribute("aria-hidden", "true");
            lightboxImg.src = "";
            document.body.style.overflow = "";
        }

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && lightbox.classList.contains("active")) {
                closeLightbox();
            }
        });
    </script>
</body>

</html>
