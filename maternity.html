<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maternity</title>

    <link rel="stylesheet" href="/css/details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous">
</head>

<body>
    <!-- Global Header Component (Single Line) -->
    <div id="site-header"></div>
    <script src="/header.js"></script>

    <main>
        <h1>MATERNITY SHOOT</h1>

        <div class="photos" id="gallery"></div>
    </main>

    <!-- Global Footer Component (Single Line) -->
    <div id="site-footer"></div>
    <script src="/footer.js"></script>
    
    <script>
        const images = ['DSC03217', 'DSC03312', 'DSC03391', 'DSC03446', 'DSC03547', 'DSC03602', 'DSC03644', 'DSC03691', 'DSC03692'];

        const gallery = document.getElementById("gallery");

        images.forEach(file => {
            const img = document.createElement("img");
            img.src = `/image/maternity/${file}.webp`;
            img.alt = file;
            gallery.appendChild(img);
        });
    </script>
</body>

</html>
