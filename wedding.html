<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding</title>

    <link rel="stylesheet" href="/css/details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous">
</head>

<body>
    <!-- Global Header Component (Single Line) -->
    <div id="site-header"></div>
    <script src="/header.js"></script>

    <main>
        <h1>WEDDING SHOOT</h1>

        <div class="photos" id="gallery"></div>
    </main>

    <!-- Global Footer Component (Single Line) -->
    <div id="site-footer"></div>
    <script src="/footer.js"></script>
    
    <script>
        const images = ['cover', 'CSM00084 4', 'CSM00102 2', 'CSM00197 2', 'CSM09878 2', 'CSM09978 2', 'DSC00287', 'DSC00321 2', 'DSC00333', 'DSC00337', 'DSC00430', 'DSC00487', 'DSC00580', 'DSC00587', 'DSC00600', 'DSC04288', 'DSC04328', 'DSC04514', 'DSC04909', 'DSC05253', 'DSC05437', 'DSC05469', 'thumbnail'];

        const gallery = document.getElementById("gallery");

        images.forEach(file => {
            const img = document.createElement("img");
            img.src = `/image/wedding/${file}.webp`;
            img.alt = file;
            gallery.appendChild(img);
        });
    </script>
</body>

</html>
