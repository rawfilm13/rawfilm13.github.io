<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding</title>

    <link rel="stylesheet" href="/css/details.css">
</head>

<body>
    <header>
        <nav>
            <img src="/image/logo.png" alt="Logo" width="40px">
            <div class="navlinks">
                <a href="/">Home</a>
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <h1>WEDDING SHOOT</h1>

        <div class="photos" id="gallery"></div>
    </main>
    
    <script>
        const images = ['cover', 'CSM00084 4', 'CSM00102 2', 'CSM00197 2', 'CSM09878 2', 'CSM09978 2', 'DSC00287', 'DSC00321 2', 'DSC00333', 'DSC00337', 'DSC00430', 'DSC00487', 'DSC00580', 'DSC00587', 'DSC00600', 'DSC04288', 'DSC04328', 'DSC04514', 'DSC04909', 'DSC05253', 'DSC05437', 'DSC05469', 'thumbnail'];

        const gallery = document.getElementById("gallery");

        images.forEach(file => {
            const img = document.createElement("img");
            img.src = `/image/wedding/${file}.webp`;
            img.alt = file;
            gallery.appendChild(img);
        });
    </script>
</body>

</html>
